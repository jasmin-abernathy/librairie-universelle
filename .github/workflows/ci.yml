name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runtime information
        run: |
          php -v
          php -m | grep -Ei 'PDO|sqlite|mbstring|SimpleXML'

      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: BnF SRU parser fixture
        run: php tests/BnfSruSourceTest.php

      - name: SQLite schema and corpus smoke test
        run: |
          rm -f data/app.sqlite
          php -r '$config = require "config/app.php"; require "src/Database.php"; require "src/Search.php"; $pdo = Database::connect($config); $tables = (int) $pdo->query("SELECT COUNT(*) FROM sqlite_master WHERE type = '\''table'\''")->fetchColumn(); if ($tables < 8) { fwrite(STDERR, "Schema incomplet\n"); exit(1); } $hasEditionContributors = (int) $pdo->query("SELECT COUNT(*) FROM sqlite_master WHERE type = '\''table'\'' AND name = '\''edition_contributors'\''")->fetchColumn(); if ($hasEditionContributors !== 1) { fwrite(STDERR, "Table edition_contributors absente\n"); exit(1); } $works = (int) $pdo->query("SELECT COUNT(*) FROM works")->fetchColumn(); if ($works < 20) { fwrite(STDERR, "Corpus MVP trop petit\n"); exit(1); } $orwell = Search::works($pdo, "George Orwell"); if (count($orwell) < 6) { fwrite(STDERR, "Corpus Orwell incomplet\n"); exit(1); } $editions1984 = (int) $pdo->query("SELECT COUNT(*) FROM editions WHERE work_id = 2")->fetchColumn(); if ($editions1984 < 9) { fwrite(STDERR, "Éditions 1984 insuffisantes\n"); exit(1); } $mis = (int) $pdo->query("SELECT COUNT(*) FROM editions WHERE work_id = 1 AND isbn13 IS NOT NULL")->fetchColumn(); if ($mis < 2) { fwrite(STDERR, "Éditions commerciales des Misérables absentes\n"); exit(1); } $offers = (int) $pdo->query("SELECT COUNT(*) FROM offers WHERE edition_id = 11 AND offer_type = '\''ebook'\''")->fetchColumn(); if ($offers < 2) { fwrite(STDERR, "Comparaison vendeurs ebook absente\n"); exit(1); } $drms = (int) $pdo->query("SELECT COUNT(DISTINCT drm_type) FROM offers WHERE edition_id = 11 AND drm_type IS NOT NULL")->fetchColumn(); if ($drms < 2) { fwrite(STDERR, "DRM vendeur non différenciés\n"); exit(1); } $camus = Search::works($pdo, "Albert Camus"); if (count($camus) < 2) { fwrite(STDERR, "Cas protégé Camus absent\n"); exit(1); } $review = (int) $pdo->query("SELECT COUNT(*) FROM works WHERE public_domain_status = '\''review'\''")->fetchColumn(); if ($review < 1) { fwrite(STDERR, "Cas juridique à vérifier absent\n"); exit(1); }'

      - name: HTTP smoke test
        run: |
          php -S 127.0.0.1:8080 -t public >/tmp/librairie-universelle-php.log 2>&1 &
          PHP_SERVER_PID=$!
          trap 'kill "$PHP_SERVER_PID"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/health.php | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8080/ | grep 'Chercher une œuvre, pas un produit.'
          curl --fail --silent 'http://127.0.0.1:8080/?q=George%20Orwell' | grep 'La Ferme des animaux'
          curl --fail --silent 'http://127.0.0.1:8080/?q=Albert%20Camus' | grep '>Non<'
          curl --fail --silent 'http://127.0.0.1:8080/?q=Le%20Petit%20Prince' | grep 'À vérifier'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=1' | grep '9782070409228'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=2' | grep 'Josée Kamoun'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=2' | grep '9782072938245'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=2' | grep 'Adobe DRM'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=2' | grep '>CARE<'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=2' | grep 'traduction française'
          curl --fail --silent 'http://127.0.0.1:8080/work.php?id=20' | grep 'À vérifier'
          curl --fail --silent http://127.0.0.1:8080/projet.php | grep 'Toutes les façons légales de lire.'
          curl --fail --silent http://127.0.0.1:8080/sans-ia.php | grep 'Pas d’IA pour décider ce que vous devriez lire.'
